# The former public URL now contains only a redirect to the authenticated
# Cloudflare website. Never publish site/index.html here: doing so would bypass
# TalentTap's account restriction.
name: Redirect legacy GitHub Pages URL

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without making a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The scheduled refresh runs twice a day. If two pushes land close
# together, deploy the newer one rather than queueing both.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on for the repo if it is not already, and
      # sets its source to this workflow. Without it, the first run fails
      # here until someone flips Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-site

      - id: deployment
        uses: actions/deploy-pages@v4
